[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "cursor-fleet"
version = "0.1.0"
description = "A Codex task-worker bridge for direct delegation and optional isolated fleet runs."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
  { name = "cursor-fleet contributors" }
]
keywords = ["codex", "cursor", "cursor-cli", "subagents", "worktree", "ai-agents", "developer-tools"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development",
  "Topic :: Software Development :: Version Control :: Git",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/YOUR_ORG/cursor-fleet"
Repository = "https://github.com/YOUR_ORG/cursor-fleet"
Issues = "https://github.com/YOUR_ORG/cursor-fleet/issues"

[project.scripts]
cursor-fleet = "cursor_fleet.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cursor_fleet"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
